name: upstream-test

# The Browser Agent project owns its application-level CI in browser-agent-ci.yml.
# Keep the upstream Browser Use test workflow available on demand without running
# the full upstream matrix/evals on every application change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Upstream Browser Use test workflow is manual-only in browser-use-agent; use Browser Agent CI for project validation."
