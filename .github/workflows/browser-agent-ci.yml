name: Browser Agent CI

on:
  push:
    paths:
      - 'browser_agent/**'
      - 'tests/test_*.py'
      - 'examples/live_harness_agent_smoke.py'
      - 'pyproject.toml'
      - '.github/workflows/browser-agent-ci.yml'
  pull_request:
    paths:
      - 'browser_agent/**'
      - 'tests/test_*.py'
      - 'examples/live_harness_agent_smoke.py'
      - 'pyproject.toml'
      - '.github/workflows/browser-agent-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - name: Install project
        run: uv sync --dev
      - name: Run browser-agent and JobPilot unit tests
        run: uv run pytest tests/test_tabs.py tests/test_connection.py tests/test_agent.py tests/test_cli.py tests/test_cli_execution.py tests/test_basic_actions.py tests/test_policy.py tests/test_jobpilot.py -q
      - name: Lint browser-agent, JobPilot layer and examples
        run: uv run ruff check browser_agent tests/test_tabs.py tests/test_connection.py tests/test_agent.py tests/test_cli.py tests/test_cli_execution.py tests/test_basic_actions.py tests/test_policy.py tests/test_jobpilot.py examples/live_harness_agent_smoke.py
      - name: Type-check browser-agent and JobPilot layers
        run: uv run pyright browser_agent
      - name: Build distribution
        run: uv build
      - name: Verify JobPilot layer is packaged
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel was produced'
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert 'browser_agent/jobpilot/__init__.py' in names, 'JobPilot package missing from wheel'
              assert 'browser_agent/jobpilot/cli.py' in names, 'JobPilot CLI missing from wheel'
          print(f'JobPilot package verification passed: {wheels[0]}')
          PY
