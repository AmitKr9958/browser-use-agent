name: Browser Agent CI

on:
  push:
    paths:
      - 'browser_agent/**'
      - 'jobpilot/**'
      - 'tests/test_*.py'
      - 'examples/live_harness_agent_smoke.py'
      - 'examples/jobpilot_prepare_application.py'
      - 'pyproject.toml'
      - '.github/workflows/browser-agent-ci.yml'
  pull_request:
    paths:
      - 'browser_agent/**'
      - 'jobpilot/**'
      - 'tests/test_*.py'
      - 'examples/live_harness_agent_smoke.py'
      - 'examples/jobpilot_prepare_application.py'
      - 'pyproject.toml'
      - '.github/workflows/browser-agent-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - name: Install project
        run: uv sync --dev
      - name: Run application unit tests
        run: uv run pytest tests/test_tabs.py tests/test_connection.py tests/test_agent.py tests/test_cli.py tests/test_cli_execution.py tests/test_basic_actions.py tests/test_llm.py tests/test_jobpilot_core.py tests/test_jobpilot_autofill.py tests/test_jobpilot_ats.py tests/test_jobpilot_browser_upload.py tests/test_jobpilot_pipeline.py tests/test_jobpilot_questions.py tests/test_jobpilot_resume_quality.py -q
      - name: Lint application layer and examples
        run: uv run ruff check browser_agent jobpilot tests/test_tabs.py tests/test_connection.py tests/test_agent.py tests/test_cli.py tests/test_cli_execution.py tests/test_basic_actions.py tests/test_llm.py tests/test_jobpilot_core.py tests/test_jobpilot_autofill.py tests/test_jobpilot_ats.py tests/test_jobpilot_browser_upload.py tests/test_jobpilot_pipeline.py tests/test_jobpilot_questions.py tests/test_jobpilot_resume_quality.py examples/live_harness_agent_smoke.py examples/jobpilot_prepare_application.py
      - name: Type-check application layer
        run: uv run pyright browser_agent jobpilot
      - name: Build distribution
        run: uv build
      - name: Verify application layers are packaged
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel was produced'
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              assert any(n.startswith('browser_agent/') for n in names), 'browser_agent package missing from wheel'
              assert any(n.startswith('jobpilot/') for n in names), 'jobpilot package missing from wheel'
          print(f'Package verification passed: {wheels[0]}')
          PY
