name: lint

# The application layer has its own CI. Keep the upstream Browser Use lint workflow
# available on demand without spamming failures on this application repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-lint:
    name: upstream-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run ruff check --no-fix --select PLE
