<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>JobPilot Dummy Application</title></head>
<body>
  <main>
    <h1>Data Analyst — Example India Pvt Ltd</h1>
    <form id="application">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" value="">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="">

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" value="">

      <label for="location">Current location</label>
      <input id="location" name="location" type="text" value="Delhi">

      <label for="resume">Resume/CV</label>
      <input id="resume" name="resume" type="file">

      <label for="salary">Expected salary</label>
      <input id="salary" name="salary" type="text" value="">

      <label for="authorized">Are you legally authorized to work in India?</label>
      <select id="authorized" name="authorized">
        <option value="">Select</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <button type="button" id="continue">Continue</button>
      <button type="submit" id="submit">Submit application</button>
    </form>
  </main>
</body>
</html>
