default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        files: ^(browser_agent/|tests/test_(tabs|connection|agent|cli)\.py$|examples/list_and_select_tabs\.py$|test_browser_use\.py$)

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        files: ^(browser_agent/|tests/test_(tabs|connection|agent|cli)\.py$|examples/list_and_select_tabs\.py$|test_browser_use\.py$|docs/.*\.md$)

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
        files: ^(browser_agent/|tests/test_(tabs|connection|agent|cli)\.py$|examples/list_and_select_tabs\.py$|test_browser_use\.py$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(browser_agent/|tests/test_(tabs|connection|agent|cli)\.py$|examples/list_and_select_tabs\.py$|test_browser_use\.py$)
      - id: ruff-format
        files: ^(browser_agent/|tests/test_(tabs|connection|agent|cli)\.py$|examples/list_and_select_tabs\.py$|test_browser_use\.py$)

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.404
    hooks:
      - id: pyright
        files: ^browser_agent/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: debug-statements
      - id: forbid-submodules
      - id: check-added-large-files
        args: ["--maxkb=600"]
